<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Idle Drive Detection - Login</title>
<style>
/* ===== BODY ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #1f4037, #99f2c8, #2c5364, #203a43);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
}

/* ===== ANIMATION ===== */
@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== LOGIN BOX ===== */
.login-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    width: 360px;
    text-align: center;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(30px);}
    to {opacity:1; transform: translateY(0);}
}

/* ===== TITLES ===== */
.login-box h2 {
    margin-bottom: 10px;
    font-weight: 600;
}
.login-box p {
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 25px;
}

/* ===== INPUTS ===== */
.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 15px;
    transition: all 0.3s ease;
}
.login-box input::placeholder {
    color: rgba(255,255,255,0.8);
}
.login-box input:focus {
    background: rgba(255,255,255,0.3);
    transform: scale(1.03);
    box-shadow: 0 0 12px rgba(255,255,255,0.6);
}

/* ===== BUTTON ===== */
.login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(to right, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}
.login-box button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 18px rgba(0,198,255,0.9);
}
</style>
</head>
<body>

<div class="login-box">
    <h2>Idle Drive Detection</h2>
    <p>Login to monitor your drives and manage workloads</p>
    <form onsubmit="login(event)">
        <input type="text" placeholder="Username" id="username" required>
        <input type="password" placeholder="Password" id="password" required>
        <button type="submit">Login</button>
    </form>
    <p id="errorMsg" style="color: #ff4b5c; margin-top: 10px;"></p>
</div>

<script>
function login(event) {
    event.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Simple demo login (replace with backend auth later)
    if(username === 'admin' && password === 'admin123') {
        window.location.href = 'dashboard.html'; // redirect to dashboard
    } else {
        document.getElementById('errorMsg').innerText = 'Invalid username or password';
    }
}
</script>

</body>
</html>
